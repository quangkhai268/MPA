server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mpa_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    provider: ${MAIL_PROVIDER:sendify}      # smtp | sendify — mặc định smtp, không đổi hành vi hiện tại
    from: ${MAIL_FROM:no-reply@mail.mybcardportal.com}
    from-name: ${MAIL_FROM_NAME:Card Management Portal}
  sendify:
    api-key: ${SENDIFY_API_KEY:sfy_qxLU9iP5_Lu57K33OLjnFZStT1tycT9brROKRCPgW}
    base-url: ${SENDIFY_BASE_URL:https://sendify.vn/api/emails}
  jwt:
    # KHÔNG đặt giá trị mặc định ở đây — JwtUtil fail-fast lúc khởi động nếu rỗng/quá ngắn.
    # Production BẮT BUỘC set biến môi trường JWT_SECRET (giống cách đang làm với DB_PASSWORD),
    # tối thiểu 32 ký tự. Môi trường dev dùng giá trị mặc định riêng ở application-dev.yml.
    secret: ${JWT_SECRET:}
    expiration: 86400000        # 24 giờ
    refresh-expiration: 604800000 # 7 ngày
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:65084,https://mpa-green.vercel.app}

management:
  endpoints:
    web:
      exposure:
        # Chỉ mở health + info ra ngoài — KHÔNG thêm env/beans/configprops... vì
        # SecurityConfig đang permitAll() mọi request, mở thêm sẽ lộ DB_PASSWORD/JWT_SECRET.
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # Mail health indicator tự bật kèm spring-boot-starter-mail và fail khi SMTP
    # chưa cấu hình (mặc định localhost:25) — email là tính năng tùy chọn
    # (CARD_EMAIL_ENABLED), không nên kéo cả app xuống DOWN vì SMTP chưa sẵn sàng.
    mail:
      enabled: false

logging:
  level:
    com.mpa: DEBUG
    org.springframework.security: INFO
