server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular Router dùng client-side routing — fallback mọi route về index.html
    # để refresh/deep-link (vd /quan-ly-am/:maAm) không bị nginx trả 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Cache tài nguyên tĩnh có hash trong tên file (Angular build output)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
